<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="72" height="72" role="img" aria-label="Orchestra">
  <style>
    .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: play 1.8s ease-in-out infinite; }
    .b2 { animation-delay: -0.6s; }
    .b3 { animation-delay: -1.2s; }
    @keyframes play { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.55); } }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none; } }
  </style>
  <rect width="24" height="24" rx="5.5" fill="#2f6fed"/>
  <g transform="translate(4.2 4.2) scale(0.65)" fill="#fff">
    <rect class="bar b1" x="4" y="13" width="3.2" height="7" rx="1.6"/>
    <rect class="bar b2" x="10.4" y="8" width="3.2" height="12" rx="1.6" opacity="0.85"/>
    <rect class="bar b3" x="16.8" y="4" width="3.2" height="16" rx="1.6" opacity="0.7"/>
  </g>
</svg>
